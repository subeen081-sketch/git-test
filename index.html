<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scroll Interaction</title>

  <!-- Pretendard 폰트 CDN 연결 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- [효과 3] 상단 스크롤 진행률 프로그래스 바 -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- 히어로 섹션 -->
  <section class="hero">
    <!-- [효과 2] 패럴랙스 배경 이미지 (스크롤보다 느리게 이동) -->
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>

    <div class="hero-content">
      <!-- [효과 1] fade-up 클래스: 아래에서 위로 페이드인 -->
      <h1 class="fade-up">Slow Down,<br />Look Closer</h1>
      <p class="fade-up delay-1">
        빠르게 지나가는 일상 속에서 잠시 멈춰 서 봅니다.<br />
        스크롤을 내리며 천천히 이야기를 따라가 보세요.
      </p>
    </div>
    <span class="scroll-hint">Scroll</span>
  </section>

  <!-- 섹션 1 -->
  <section class="section">
    <div class="section-inner">
      <div class="text">
        <h2 class="fade-up">Nature</h2>
        <p class="fade-up delay-1">
          자연은 언제나 같은 자리에서 우리를 기다립니다.<br />
          조용한 숲길을 걷다 보면 생각이 맑아집니다.
        </p>
      </div>
      <figure class="image fade-up delay-2">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1200&q=80" alt="햇살이 비치는 숲" loading="lazy" />
      </figure>
    </div>
  </section>

  <!-- 섹션 2 (이미지 왼쪽 배치) -->
  <section class="section">
    <div class="section-inner reverse">
      <div class="text">
        <h2 class="fade-up">Space</h2>
        <p class="fade-up delay-1">
          비워진 공간은 오히려 더 많은 것을 담습니다.<br />
          여백은 생각이 머물 수 있는 자리입니다.
        </p>
      </div>
      <figure class="image fade-up delay-2">
        <img src="https://images.unsplash.com/photo-1494438639946-1ebd1d20bf85?auto=format&fit=crop&w=1200&q=80" alt="미니멀한 실내 공간" loading="lazy" />
      </figure>
    </div>
  </section>

  <!-- 섹션 3 -->
  <section class="section">
    <div class="section-inner">
      <div class="text">
        <h2 class="fade-up">Moment</h2>
        <p class="fade-up delay-1">
          지금 이 순간은 다시 돌아오지 않습니다.<br />
          작은 장면 하나도 오래 기억해 두세요.
        </p>
      </div>
      <figure class="image fade-up delay-2">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=80" alt="노을 지는 바다" loading="lazy" />
      </figure>
    </div>
  </section>

  <footer class="footer">© 2026 Scroll Interaction</footer>

  <script src="script.js"></script>
</body>
</html>
